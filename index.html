<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>tucuadro.madre | Rifa Relámpago</title>
    <meta property="og:title" content="Dia de la Madre">
    <meta property="og:image" content="https://i.pinimg.com/736x/71/82/ed/7182ed29ffe4c5c4063837f14022b821.jpg">
    <meta property="og:description" content="Selecciona tu número y gana. Boleta a $10.000">

    <style>
        :root { --dorado: #b8860b; --gris: #f4f4f4; --rosa-nequi: #da127d; --verde: #27ae60; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--gris); margin: 0; padding: 15px; text-align: center; overflow-x: hidden; }
        
        /* Rosas en los bordes */
        .rose-container { position: fixed; top: 0; width: 80px; height: 100%; pointer-events: none; z-index: 999; }
        .roses-left { left: 0; } .roses-right { right: 0; }
        .rose { position: absolute; font-size: 25px; animation: fall linear infinite; opacity: 0; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        
        /* Encabezado con imagen pequeña y texto del sorteo */
        .header-rifa { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .img-icono { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); }
        .sorteo-info { font-size: 13px; color: #444; font-weight: bold; line-height: 1.2; text-align: left; }
        
        img.principal { width: 100%; border-radius: 15px; margin: 15px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h1 { color: var(--dorado); margin: 0; font-size: 24px; }
        .precio { font-size: 24px; color: var(--verde); font-weight: bold; margin: 10px 0; }
        
        /* Grilla */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .n { padding: 15px 0; background: white; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .n.vendido { background: #ffcccc; color: #cc0000; border-color: #ffaaaa; cursor: not-allowed; opacity: 0.6; }
        .n.selected { background: var(--dorado); color: white; transform: scale(1.05); }

        /* Formulario Flotante */
        #modal-pago { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-content h3 { color: var(--rosa-nequi); margin-top: 0; text-align: center; }
        .modal-content label { display: block; font-size: 14px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-confirmar { width: 100%; background: var(--rosa-nequi); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-cerrar { background: none; border: none; color: #999; float: right; font-size: 24px; cursor: pointer; line-height: 1; }
    </style>
</head>
<body>

<audio id="musicaRifa" loop><source src="https://raw.githubusercontent.com/ariaiaa2001-lang/tucuadro/main/Joe%20Arroyo%20-%20Mama.mp3" type="audio/mpeg"></audio>

<div class="rose-container roses-left" id="rosesLeft"></div>
<div class="rose-container roses-right" id="rosesRight"></div>

<div class="card">
    <h1>tucuadro.madre 🎨</h1>
    
    <!-- Encabezado actualizado con el icono de Sinuano -->
    <div class="header-rifa">
        <img src="https://i.pinimg.com/736x/59/70/58/597058fc250c24e0d3ea6f051586710a.jpg" class="img-icono" alt="Sinuano Icono">
        <div class="sorteo-info">
            Juega el 09/05/2026<br>
            Con las 2 últimas cifras del Sinuano Noche
        </div>
    </div>

    <img src="https://i.pinimg.com/736x/71/82/ed/7182ed29ffe4c5c4063837f14022b821.jpg" class="principal" alt="Cuadro Principal">
    
    <div class="precio">Valor Boleta: $10.000</div>
    <p style="font-size: 14px; color: #555;">Selecciona el número que te dará la suerte:</p>
    
    <div id="tablero" class="grid"></div>
</div>

<!-- FORMULARIO DE DATOS -->
<div id="modal-pago">
    <div class="modal-content">
        <button class="btn-cerrar" onclick="cerrarModal()">×</button>
        <h3 id="tituloBoleta">Boleta #--</h3>
        
        <label>Tu Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
        
        <label>Tu WhatsApp / Celular:</label>
        <input type="tel" id="telefono" placeholder="Ej: 300 000 0000">
        
        <label>Vendido por:</label>
        <input type="text" id="vendedor" placeholder="Ej: Pedro, María, Instagram...">

        <button class="btn-confirmar" onclick="enviarWhatsApp()">LISTO, PAGAR POR NEQUI</button>
    </div>
</div>

<script>
    const SHEET_ID = '12fOsLyGGJuNJ4qwmHDIz3gDQ6yScFyowk6s-E_OPexQ'; 
    const MI_WHATSAPP = "573004359786"; 
    const tablero = document.getElementById('tablero');
    const modal = document.getElementById('modal-pago');
    const musica = document.getElementById('musicaRifa');
    let seleccionado = null;

    document.addEventListener('click', () => { 
        musica.play().catch(e => {}); 
    }, { once: true });

    function createRoses() {
        const containers = [document.getElementById('rosesLeft'), document.getElementById('rosesRight')];
        containers.forEach(container => {
            for(let i=0; i<12; i++) {
                let rose = document.createElement('div');
                rose.className = 'rose'; rose.innerText = '🌹';
                rose.style.left = Math.random() * 100 + '%';
                rose.style.animationDuration = (Math.random() * 3 + 2) + 's';
                rose.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(rose);
            }
        });
    }

    async function cargarRifa() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const filas = json.table.rows;
            tablero.innerHTML = '';

            for (let i = 0; i < 100; i++) {
                const nStr = i.toString().padStart(2, '0');
                const div = document.createElement('div');
                let esVendido = false;
                
                if (filas[i + 1] && filas[i + 1].c && filas[i + 1].c[1] && filas[i + 1].c[1].v) {
                    if (filas[i + 1].c[1].v.toString().toLowerCase().includes('vendido')) esVendido = true;
                }
                
                div.className = 'n' + (esVendido ? ' vendido' : '');
                div.innerText = nStr;
                
                if (!esVendido) {
                    div.onclick = () => abrirModal(nStr);
                }
                tablero.appendChild(div);
            }
        } catch (e) { 
            tablero.innerHTML = "Error cargando números."; 
        }
    }

    function abrirModal(numero) {
        seleccionado = numero;
        document.getElementById('tituloBoleta').innerText = "Boleta #" + numero;
        modal.style.display = 'flex';
    }

    function cerrarModal() { modal.style.display = 'none'; }

    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value;
        const tel = document.getElementById('telefono').value;
        const vend = document.getElementById('vendedor').value;

        if(!nombre || !tel || !vend) {
            alert("Por favor completa todos los campos");
            return;
        }

        const msg = `¡Hola tucuadro.madre! 🎨%0A%0AQuiero la boleta: *#${seleccionado}*%0A%0A*Datos del Comprador:*%0A- Nombre: ${nombre}%0A- Celular: ${tel}%0A- Vendedor: ${vend}%0A%0ASorteo: Sinuano Noche (09/05/2026)%0AYa voy a realizar el pago de *$10.000* por Nequi.`;
        
        window.open(`https://wa.me/${MI_WHATSAPP}?text=${msg}`, '_blank');
        cerrarModal();
    }

    createRoses();
    cargarRifa();
</script>
</body>
</html>
